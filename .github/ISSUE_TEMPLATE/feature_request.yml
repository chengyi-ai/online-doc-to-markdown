name: 功能建议 / Feature request
description: 支持新的文档平台或链接类型、改进 Markdown 输出、下载与界面体验
labels: ["needs-triage", "source:github", "type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        提交后 Agent 会自动评估可行性。本项目的边界：只转换**未登录也能打开**的公开文档；不绕过登录、权限或付费墙，不收集账号凭据；不在服务端保存文档内容；转换忠实于原文、不改写。
        超出这些边界的需求（读取私有文档、批量抓取、通用网页代理等）不会采纳。请不要贴私有文档链接或内容。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你在转换哪个平台、哪类文档时遇到了什么不便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 理想中的输出效果或交互，例如某种块希望转成什么样的 Markdown。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
